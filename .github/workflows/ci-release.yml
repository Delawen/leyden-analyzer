# This workflow will build and create a release when a tag following semver
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']

jobs:
  release:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6.2.0
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}
        cache: maven

    - name: Set up version RELEASE
      run:  mvn versions:set -DnewVersion=${{ github.ref_name }}

    - name: Build
      run:  ./mvnw verify -Dquarkus.package.jar.type=uber-jar

    - name: Release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
      with:
        files: target/*-runner.jar
        make_latest: true
        prerelease: false
        generate_release_notes: true
        draft: true

    - name: Set up version SNAPSHOT
      if: ${{ ! endsWith(github.ref_name, 'dev') }}
      run:  mvn versions:set -DnewVersion=${{ github.ref_name }}-SNAPSHOT

    - name: Creates commit with new version SNAPSHOT
      uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8
      if: ${{ ! endsWith(github.ref_name, 'dev') }}
      with:
          add: 'pom.xml'
          author_name: "Github Action"
          author_email: automated@delawen.com
          commit: --signoff
          committer_name: María Arias de Reyna Domínguez
          message: 'auto: Update version to ${{ github.ref_name }}-SNAPSHOT'
          new_branch: update-version-to-${{ github.ref_name }}-SNAPSHOT
          push_attempts: 3


    - name: Open pull request for version SNAPSHOT
      if: ${{ ! endsWith(github.ref_name, 'dev') }}
      run: |
        gh pr create \
          --title "auto: Update to version ${{ github.ref_name }}-SNAPSHOT" \
          --body "This PR was automatically created by the release job." \
          --base main \
          --head update-version-to-${{ github.ref_name }}-SNAPSHOT
      env:
        GITHUB_TOKEN: ${{ github.token }}

