name: Native Support

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  build-cache-for-testing:
    name: Building assets for (${{ matrix.java.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        java: # If you change it here, change it below too
          - version: '25'
          - version: '26'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      # Build and run the leyden analyzer to generate an aot cache to test
      - name: Set up JDK ${{ matrix.java.version }} for Generating Cache for Testing
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java.version }}
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}
          cache: maven

      - name: Build quick without tests
        run: ./mvnw package -DskipTests

      - name: Generating basic cache and training logs
        timeout-minutes: 5
        run: |
          echo "Launching the analyzer to generate a cache"
          java -XX:AOTCacheOutput=target/app.aot \
              -Xlog:aot+map=trace,aot+map+oops=trace,aot=warning:file=target/aot.map:none:filesize=0 \
              -Xlog:aot+resolve*=trace,aot+codecache+exit=debug:file=target/training.log:level,tags \
              -jar target/quarkus-app/quarkus-run.jar instructions=src/test/resources/instructions/commands0.txt

      - name: Generating production logs
        timeout-minutes: 2
        run: |
          echo "Launching the analyzer to generate production logs"
          java -XX:AOTCache=target/app.aot \
              -Xlog:class+load=info,aot+codecache=debug:file=target/production.log:level,tags \
              -jar target/quarkus-app/quarkus-run.jar instructions=src/test/resources/instructions/commands0.txt

      - name: Upload cache and logs
        uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.java.version }}
          path: |
            target/*log
            target/app.aot
            target/aot.map
          retention-days: 2

  native-build-and-test:
    needs: build-cache-for-testing
    permissions:
      contents: read
    name: Native (${{ matrix.os }}, Mandrel JDK ${{ matrix.mandrel.java }}, AOT Cache version ${{ matrix.java.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mandrel:
          - java: '25'
            version: '25.0.2.0-Final'
        java: # If you change it here, change it above too
          - version: '25'
          - version: '26'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache Mandrel Archive
        uses: actions/cache@v5
        with:
          path: _mandrel_cache
          key: mandrel-archive-${{ runner.os }}-java${{ matrix.mandrel.java }}-${{ matrix.mandrel.version }}

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      #Now we prepare the environment to build the native image
      - name: Download and Setup Mandrel (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p _mandrel_cache
          ARCHIVE="_mandrel_cache/mandrel.tar.gz"
          if [ ! -f "$ARCHIVE" ]; then
            echo "Cache miss: Downloading Mandrel..."
            curl -L -o "$ARCHIVE" "https://github.com/graalvm/mandrel/releases/download/mandrel-${{ matrix.mandrel.version }}/mandrel-java${{ matrix.mandrel.java }}-linux-amd64-${{ matrix.mandrel.version }}.tar.gz"
          else
            echo "Cache hit: Using existing Mandrel archive..."
          fi
          tar -xzf "$ARCHIVE"
          echo "GRAALVM_HOME=$GITHUB_WORKSPACE/mandrel-java${{ matrix.mandrel.java }}-${{ matrix.mandrel.version }}" >> $GITHUB_ENV
          echo "JAVA_HOME=$GITHUB_WORKSPACE/mandrel-java${{ matrix.mandrel.java }}-${{ matrix.mandrel.version }}" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/mandrel-java${{ matrix.mandrel.java }}-${{ matrix.mandrel.version }}/bin" >> $GITHUB_PATH
      - name: Download and Setup Mandrel (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path _mandrel_cache | Out-Null
          $archive = "_mandrel_cache\mandrel.zip"
          if (-Not (Test-Path $archive)) {
            Write-Host "Cache miss: Downloading Mandrel..."
            $url = "https://github.com/graalvm/mandrel/releases/download/mandrel-${{ matrix.mandrel.version }}/mandrel-java${{ matrix.mandrel.java }}-windows-amd64-${{ matrix.mandrel.version }}.zip"
            $wc = New-Object System.Net.WebClient
            $wc.DownloadFile($url, $archive)
          } else {
            Write-Host "Cache hit: Using existing Mandrel archive..."
          }
          Expand-Archive $archive -DestinationPath "${{ github.workspace }}" -Force
          Move-Item (Get-ChildItem mandrel-java*).name ${{ github.workspace }}\${{ matrix.mandrel.java }}-${{ matrix.mandrel.version }}
          echo "GRAALVM_HOME=${{ github.workspace }}\${{ matrix.mandrel.java }}-${{ matrix.mandrel.version }}" >> $env:GITHUB_ENV
          echo "JAVA_HOME=${{ github.workspace }}\${{ matrix.mandrel.java }}-${{ matrix.mandrel.version }}" >> $env:GITHUB_ENV

      # Recover test assets from previous job
      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          name: assets-${{ matrix.java.version }}

      #And we build and test
      - name: Build and Test Native (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          MAVEN_OPTS: -Xmx1g
          # Headless CI, on Windows, JLine keeps looking for a real terminal and takes ages.
          JAVA_TOOL_OPTIONS: "-Dorg.jline.terminal.dumb=true -Dorg.jline.terminal.exec=false"
        run: |
          set "PATH=%JAVA_HOME%\bin;%PATH%"
          if not exist "%GRAALVM_HOME%\bin\native-image.cmd" ( echo "Cannot find native-image tool. Quitting..." & exit 1 )
          cmd /C native-image --version
          cmd /C mvn clean verify --batch-mode -Pnative
      - name: Build and Test Native (Linux)
        if: runner.os == 'Linux'
        run: |
          native-image --version
          ./mvnw clean verify -B -Pnative

      - name: Summary
        run: |
          echo "# Summary" >> $GITHUB_STEP_SUMMARY
          echo "The assets generated are: " >> $GITHUB_STEP_SUMMARY
          echo "- Native App ("$(du -sh *runner )")" >> $GITHUB_STEP_SUMMARY
          echo "- AOT Cache ("$(du -sh app.aot )")" >> $GITHUB_STEP_SUMMARY
          echo "- Training logs ("$(du -sh training.log*)")" >> $GITHUB_STEP_SUMMARY
          echo "- Production logs ("$(du -sh production.log*)")" >> $GITHUB_STEP_SUMMARY
          echo "- AOT Map File ("$(du -sh aot.map )")" >> $GITHUB_STEP_SUMMARY